# headless service (ingen ClusterIP). Hver pod får sit eget DNS-navn tilhørende ID
apiVersion: v1
kind: Service
metadata:
  name: bully
spec:
  clusterIP: None
  # pods kan findes i DNS før de er klar
  publishNotReadyAddresses: true
  selector:
    app: bully
  ports:
    - name: http
      port: 8080
