# statefulset kører N kopier af imaget med navne bully-0 ... bully-(N-1)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bully
spec:
  # forbinder pods til headless service
  serviceName: bully
  # antal noder N, skal matche CLUSTER_SIZE
  replicas: 5
  # starter alle pods samtidigt
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: bully
  template:
    metadata:
      labels:
        app: bully
    spec:
      # fjerner pod senest 2 sek efter en pod slettes
      terminationGracePeriodSeconds: 2
      containers:
        - name: bully
          image: bully-app:latest
          # bruger lokalt image, puller ikke
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          # styrer ready kolonnen, når vi inspicerer pods
          # noderne kan nå hinanden inden en pod er markeret som ready
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: CLUSTER_SIZE
              value: "5"
            - name: SERVICE_NAME
              value: "bully"
            - name: ALGORITHM
              value: "improved"
