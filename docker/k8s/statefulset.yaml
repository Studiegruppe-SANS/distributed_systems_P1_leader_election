# StatefulSet: koerer N kopier af imaget med faste navne bully-0 ... bully-(N-1).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bully
spec:
  serviceName: bully              # knytter poddene til den headless service
  replicas: 5                     # antal noder (husk ogsaa CLUSTER_SIZE nedenfor)
  podManagementPolicy: Parallel   # start alle pods samtidig i stedet for en ad gangen
  selector:
    matchLabels:
      app: bully
  template:
    metadata:
      labels:
        app: bully
    spec:
      terminationGracePeriodSeconds: 2   # luk hurtigt ned ved delete/scale
      containers:
        - name: bully
          image: bully-app:latest
          imagePullPolicy: Never         # brug det lokalt byggede image, hent intet
          ports:
            - containerPort: 8080
          # Klar naar HTTP-serveren svarer. DNS virker allerede foer (publishNotReadyAddresses),
          # saa proben paavirker ikke valget — kun kubectl get pods / rollout status.
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: CLUSTER_SIZE
              value: "5"
            - name: SERVICE_NAME
              value: "bully"
            - name: ALGORITHM
              value: "improved"
