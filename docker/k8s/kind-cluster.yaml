# lokal kubernetes cluster i Docker (kind), inddelt med 1 control-plane + 2 workers,
# fordeler pods over flere noder
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # gør web-servicens NodePort tilgængelig på http://localhost:30080
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
